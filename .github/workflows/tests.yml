name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: pip install -r requirements-test.txt
      - name: Run tests
        # Covers the Kelly staking maths, value-bet detection, de-vigging, and
        # the look-ahead guarantees on feature construction.
        run: pytest tests/ -v
